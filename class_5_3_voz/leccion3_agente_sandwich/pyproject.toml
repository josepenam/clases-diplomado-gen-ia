description = "Agente de voz por el método sándwich: STT → agente de texto → TTS, con Gradio."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.1",
    "langchain-tavily==0.2.18",
    "openai==2.52.0",
    "gradio==6.22.0",
    "python-dotenv==1.2.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[tool.uv]
package = false
