[project]
name = "leccion4-agente-sql-semantico"
version = "0.1.0"
description = "Agente SQL semántico: create_agent (LangChain 1.x) + gpt-5-mini con herramientas de Cypher y SQL guardadas, informado por el grafo de la lección 3."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.2",
    "neocarta==0.8.0",
    "neo4j==6.2.0",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "matplotlib==3.11.1",
    "networkx==3.6.1",
    "python-dotenv==1.2.2",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
