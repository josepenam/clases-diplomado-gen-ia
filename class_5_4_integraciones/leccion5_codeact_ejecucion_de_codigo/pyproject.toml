[project]
name = "leccion5-codeact-ejecucion-de-codigo"
version = "0.1.0"
description = "CodeAct: el sandbox de ejecución de código de Anthropic (claude-opus-5 + code_execution) contra un agente de tool-calling puro (gpt-5-mini) en el mismo análisis."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==0.121.0",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.2",
    "pandas==2.3.3",
    "matplotlib==3.11.1",
    "python-dotenv==1.2.2",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
