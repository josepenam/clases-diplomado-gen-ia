[project]
name = "leccion3-capa-semantica"
version = "0.1.0"
description = "Capa semántica sobre una base de datos mockeada: SQLite → neocarta → Neo4j, con ontología de negocio y enriquecimiento LLM (gpt-5-mini)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "neocarta==0.8.0",
    "neo4j==6.2.0",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "openai==2.53.0",
    "matplotlib==3.11.1",
    "networkx==3.6.1",
    "python-dotenv==1.2.2",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
